{% extends 'base.html' %}

{% block title %}Beheren Aways{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Awaylijst</h2>
        <input type="text" id="searchInput" class="form-control form-control-sm mb-3"
               placeholder="🔍 Zoek op awaynaam..." onkeyup="filterAways()" style="max-width: 300px;">
        <a href="{{ url_for('add_away') }}" class="btn btn-primary btn-sm">Away toevoegen</a>
    </div>

    <div style="max-height: calc(100vh - 200px); overflow-y: auto;">
        <table class="table table-striped">
            <thead class="sticky-header">
                <tr>
                    <th>Awaynaam</th>
                    <th>Waarde</th>
                    <th>Acties</th>
                </tr>
            </thead>
            <tbody id="awayTable">
                {% for away in aways %}
                <tr>
                    <td class="awaynaam">{{ away.naam }}</td>
                    <td class="awaywaarde">{{ away.waarde }}</td>
                    <td>
                        <a href="{{ url_for('edit_away', id=away.id) }}" class="btn btn-sm btn-warning action-button">
                            <img src="{{ url_for('static', filename='pencil.png') }}" alt="Bewerk" style="width: 20px; height: 20px;">
                        </a>
                        <form action="{{ url_for('delete_away', id=away.id) }}" method="POST" style="display:inline;" id="delete-form-{{ away.id }}">
                            <button type="button" class="btn btn-sm btn-danger action-button" onclick="confirmDelete({{ away.id }})">
                                <img src="{{ url_for('static', filename='cross.png') }}" alt="Verwijder" style="width: 20px; height: 20px;">
                            </button>
                        </form>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<script>
    function confirmDelete(awayId) {
        var confirmation = confirm("Weet je zeker dat je deze away wilt verwijderen?");
        if (confirmation) {
            document.getElementById('delete-form-' + awayId).submit();
        }
    }

    function filterAways() {
        var input, filter, table, tr, td, i, txtValue;
        input = document.getElementById("searchInput");
        filter = input.value.toLowerCase();
        table = document.getElementById("awayTable");
        tr = table.getElementsByTagName("tr");

        for (i = 0; i < tr.length; i++) {
            td = tr[i].getElementsByClassName("awaynaam")[0];
            if (td) {
                txtValue = td.textContent || td.innerText;
                if (txtValue.toLowerCase().includes(filter)) {
                    tr[i].style.display = "";
                } else {
                    tr[i].style.display = "none";
                }
            }
        }
    }
</script>

<style>
    html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
    }
    .container {
        height: calc(85vh - 56px);
        display: flex;
        flex-direction: column;
    }
    .table-container {
        flex: 1;
        overflow-y: auto;
    }
    .sticky-header {
        position: sticky;
        top: 0;
        background-color: white;
        z-index: 1;
    }

    /* Pas de breedte van de kolommen aan */
    .table th, .table td {
        padding: 8px; /* Pas de padding aan indien nodig */
    }

    .table th:nth-child(1), .table td:nth-child(1) {
        width: 50%; /* Awaynaam kolom breedte */
    }

    .table th:nth-child(2), .table td:nth-child(2) {
        width: 20%; /* Waarde kolom breedte */
    }

    .table th:nth-child(3), .table td:nth-child(3) {
        width: 30%; /* Acties kolom breedte */
    }

    /* Verminder de marge tussen de knoppen */
    .action-button {
        margin-left: 7px; /* Pas deze waarde aan om de marge te verkleinen */
    }



    @media (max-width: 768px) {
        .table th, .table td {
            font-size: 14px;
        }

        .btn-sm {
            padding: 3px 6px; /* Behoud de aangepaste padding voor mobiel */
            font-size: 12px;
        }

        .form-control-sm {
            font-size: 14px;
        }

        /* Pas de breedte van de kolommen aan voor mobiele weergave */
        .table th:nth-child(1), .table td:nth-child(1) {
            width: 40%; /* Awaynaam kolom breedte voor mobiel */
        }

        .table th:nth-child(2), .table td:nth-child(2) {
            width: 20%; /* Waarde kolom breedte voor mobiel */
        }

        .table th:nth-child(3), .table td:nth-child(3) {
            width: 40%; /* Acties kolom breedte voor mobiel */
        }
    }
</style>
{% endblock %}
