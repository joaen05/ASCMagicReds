<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Away Bewerken</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            max-width: 700px;
            margin-top: 40px;
        }

        .card {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            background: white;
        }

        .form-label {
            font-weight: 500;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h3 class="text-center mb-4">Wijzig Away</h3>
        <form method="POST" action="{{ url_for('edit_away', id=away['id']) }}">
            <div class="row mb-3">
                <div class="col-md-8">
                    <label for="naam" class="form-label">Naam:</label>
                    <input type="text" class="form-control" id="naam" name="naam" value="{{ away['naam'] }}" required />
                </div>
                <div class="col-md-4">
                    <label for="waarde_away" class="form-label">Waarde:</label>
                    <input type="number" class="form-control" id="waarde_away" name="waarde_away" value="{{ away['waarde'] }}" required />
                </div>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('beheren_away') }}" class="btn btn-secondary">Ga terug</a>
                <button type="submit" class="btn btn-primary">Opslaan</button>
            </div>
        </form>

        {% if error %}
        <div class="alert alert-danger mt-4" role="alert">
            {{ error }}
        </div>
        {% endif %}
    </div>
</div>
</body>
</html>
