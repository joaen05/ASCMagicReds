{% extends 'base.html' %}

{% block title %}Bewerk Lijst{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Bewerk Lijst</h2>
        <input type="text" id="searchInput" class="form-control form-control-sm mb-3"
           placeholder="🔍 Zoek op voornaam..." onkeyup="filterLeden()" style="max-width: 400px;">
    </div>

    <div style="max-height: calc(100vh - 200px); overflow-y: auto;">
        <table class="table table-striped">
            <thead class="sticky-header">
                <tr>
                    <th>#</th>
                    <th>Voornaam</th>
                    <th>Achternaam</th>
                    <th>One Account ID</th>
                    <th>Acties</th>
                </tr>
            </thead>
            <tbody id="ledenTable">
                {% for lid in geselecteerde_leden %}
                <tr>
                    <td>{{ loop.index }}</td>
                    <td class="voornaam">{{ lid[1] }}</td>
                    <td>{{ lid[2] }}</td>
                    <td>{{ lid[3] }}</td>
                    <td>
                        <div class="dropdown">
                            <button class="btn btn-sm btn-danger dropdown-toggle" type="button" id="dropdownMenu{{ loop.index }}" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                <img src="{{ url_for('static', filename='cross.png') }}" alt="Verwijder" style="width: 20px; height: 20px;">
                            </button>
                            <div class="dropdown-menu" aria-labelledby="dropdownMenu{{ loop.index }}">
                                <a class="dropdown-item" id="volgendLidLink{{ loop.index }}" href="{{ url_for('vervang_gebruiker', away_id=away_id, verwijderde_user_id=lid[0]) }}">Volgend lid</a>
                                <a class="dropdown-item" href="#">Zelf kiezen</a>
                            </div>
                        </div>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <div class="mt-4 d-flex justify-content-between">
        <a href="{{ url_for('away_lijsten') }}" class="btn btn-secondary">Terug</a>
    </div>
</div>

<script>

    document.addEventListener("DOMContentLoaded", function() {
        const ledenInWacht = {{ leden_in_wacht | tojson }};  // Haal de waarde van leden_in_wacht op

        if (!ledenInWacht) {
            // Schakel alle "Volgend lid" links uit
            const volgendLidLinks = document.querySelectorAll('[id^="volgendLidLink"]');
            volgendLidLinks.forEach(link => {
                link.removeAttribute('href');  // Verwijder de href
                link.style.pointerEvents = 'none';  // Voorkom klikken
                link.style.opacity = '0.5';  // Maak de link doorzichtig
                link.classList.add('disabled');  // Voeg een disabled klasse toe
            });
        }
    });

    function filterLeden() {
        var input, filter, table, tr, td, i, txtValue;
        input = document.getElementById("searchInput");
        filter = input.value.toLowerCase();
        table = document.getElementById("ledenTable");
        tr = table.getElementsByTagName("tr");

        for (i = 0; i < tr.length; i++) {
            td = tr[i].getElementsByClassName("voornaam")[0];
            if (td) {
                txtValue = td.textContent || td.innerText;
                if (txtValue.toLowerCase().includes(filter)) {
                    tr[i].style.display = "";
                } else {
                    tr[i].style.display = "none";
                }
            }
        }
    }
</script>

<style>
    html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
    }
    .container {
        height: calc(85vh - 56px);
        display: flex;
        flex-direction: column;
    }
    .table-container {
        flex: 1;
        overflow-y: auto;
    }
    .sticky-header {
        position: sticky;
        top: 0;
        background-color: white;
        z-index: 1;
    }
    .disabled {
        color: gray !important;
        cursor: not-allowed !important;
    }


    @media (max-width: 768px) {
        .table th, .table td {
            font-size: 14px;
        }

        .form-control-sm {
            font-size: 14px;
        }
    }


</style>
{% endblock %}
