{% extends 'base.html' %}

{% block title %}Beheren Leden{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Ledenlijst</h2>
        <input type="text" id="searchInput" class="form-control form-control-sm mb-3"
               placeholder="🔍 Zoek op voornaam..." onkeyup="filterLeden()" style="max-width: 400px;">

        <a href="{{ url_for('add_user') }}" class="btn btn-primary btn-sm">Lid toevoegen</a>
    </div>

    <div style="max-height: calc(100vh - 200px); overflow-y: auto;">
        <table class="table table-striped">
            <thead class="sticky-header">
            <tr>
                <th>Voornaam</th>
                <th>Achternaam</th>
                <th>Acties</th>
            </tr>
            </thead>
            <tbody id="ledenTable">
            {% for lid in leden %}
            <tr>
                <td class="voornaam">{{ lid.voornaam }}</td>
                <td>{{ lid.naam }}</td>
                <td>
                    <div class="button-container">
                        <a href="{{ url_for('edit_member', id=lid.id) }}" class="btn btn-sm btn-warning">
                            <img src="{{ url_for('static', filename='pencil.png') }}" alt="Bewerk"
                                 style="width: 20px; height: 20px;">
                        </a>
                        <form action="{{ url_for('delete_member', id=lid.id) }}" method="POST" style="display:inline;"
                              id="delete-form-{{ lid.id }}">
                            <button type="button" class="btn btn-sm btn-danger action-button"
                                    onclick="confirmDelete({{ lid.id }})">
                                <img src="{{ url_for('static', filename='cross.png') }}" alt="Verwijder"
                                     style="width: 20px; height: 20px;">
                            </button>
                        </form>
                    </div>
                </td>
            </tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<script>
    function confirmDelete(lidId) {
        var confirmation = confirm("Weet je zeker dat je dit lid wilt verwijderen?");
        if (confirmation) {
            document.getElementById('delete-form-' + lidId).submit();
        }
    }

    function filterLeden() {
        var input, filter, table, tr, td, i, txtValue;
        input = document.getElementById("searchInput");
        filter = input.value.toLowerCase();
        table = document.getElementById("ledenTable");
        tr = table.getElementsByTagName("tr");

        for (i = 0; i < tr.length; i++) {
            td = tr[i].getElementsByClassName("voornaam")[0];
            if (td) {
                txtValue = td.textContent || td.innerText;
                if (txtValue.toLowerCase().includes(filter)) {
                    tr[i].style.display = "";
                } else {
                    tr[i].style.display = "none";
                }
            }
        }
    }

    document.addEventListener('DOMContentLoaded', function () {
        const input = document.getElementById("searchInput");

        input.addEventListener('input', function () {
            this.value = this.value.replace(/[^a-zA-ZÀ-ÿ]/g, '');
        });
    });

</script>

<style>
    html, body {
        height: 100%;
        margin: 0;
        overflow: hidden;
    }

    .container {
        height: calc(85vh - 56px);
        display: flex;
        flex-direction: column;
    }

    .table-container {
        flex: 1;
        overflow-y: auto;
    }

    .sticky-header {
        position: sticky;
        top: 0;
        background-color: white;
        z-index: 1;
    }

    .button-container {
        display: flex;
        white-space: nowrap;
        overflow-x: auto;
    }

    .button-container .btn {
        flex: 0 0 auto;
        margin-right: 5px;
    }

    @media (max-width: 768px) {
        .table th, .table td {
            font-size: 14px;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
        }

        .form-control-sm {
            font-size: 14px;
        }
    }
</style>
{% endblock %}
