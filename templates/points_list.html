{% extends 'base.html' %}

{% block title %}Puntenlijst{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Puntenoverzicht</h2>
        <input type="text" id="searchInput" class="form-control form-control-sm mb-3"
           placeholder="🔍 Zoek op voornaam..." onkeyup="filterLeden()" style="max-width: 400px;">
    </div>

    <div style="max-height: calc(100vh - 200px); overflow-y: auto;">
        <table class="table table-striped">
            <thead class="sticky-header">
                <tr>
                    <th>#</th> <!-- Kolom voor plaatsnummer -->
                    <th>Voornaam</th>
                    <th>Achternaam</th>
                    <th>Puntenaantal</th>
                </tr>
            </thead>
            <tbody id="ledenTable">
                {% for lid in leden %}
                <tr {% if lid.is_logged_in %}class="table-primary"{% endif %}> <!-- Fluoriseer de ingelogde gebruiker -->
                    <td>{{ loop.index }}</td> <!-- Index voor plaatsnummer -->
                    <td class="voornaam">{{ lid.voornaam }}</td>
                    <td>{{ lid.naam }}</td>
                    <td>{{ lid.puntenaantal }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>

<script>
    function filterLeden() {
        var input, filter, table, tr, td, i, txtValue;
        input = document.getElementById("searchInput");
        filter = input.value.toLowerCase();
        table = document.getElementById("ledenTable");
        tr = table.getElementsByTagName("tr");

        for (i = 0; i < tr.length; i++) {
            td = tr[i].getElementsByClassName("voornaam")[0]; // Zoek nu op voornaam
            if (td) {
                txtValue = td.textContent || td.innerText;
                if (txtValue.toLowerCase().includes(filter)) {
                    tr[i].style.display = "";
                } else {
                    tr[i].style.display = "none";
                }
            }
        }
    }
</script>

<style>
    html, body {
        height: 100%;
        margin: 0;
        overflow: hidden; /* Voorkomt scrollen op de hele pagina */
    }
    .container {
        height: calc(85vh - 56px); /* Pas de hoogte aan op basis van de hoogte van de navbar */
        display: flex;
        flex-direction: column;
    }
    .table-container {
        flex: 1;
        overflow-y: auto; /* Scrollbar alleen voor de tabel */
    }
    .sticky-header {
        position: sticky;
        top: 0;
        background-color: white; /* Zorg ervoor dat de achtergrondkleur overeenkomt met de tabel */
        z-index: 1; /* Zorg ervoor dat de koprij boven de andere rijen blijft */
    }
</style>
{% endblock %}
