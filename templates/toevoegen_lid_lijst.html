<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Toevoegen Lid</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" rel="stylesheet" />

    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            max-width: 700px;
            margin-top: 40px;
        }

        .card {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            background: white;
        }

        .form-label {
            font-weight: 500;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        /* Select2 aanpassingen om goed te integreren */
        .select2-container .select2-selection--single {
            height: 38px;
            padding: 6px 12px;
            border: 1px solid #ced4da;
            border-radius: 0.375rem;
        }

        .select2-container--default .select2-selection--single .select2-selection__rendered {
            line-height: 24px;
        }

        @media (max-width: 768px) {
            .form-control, .select2-container {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h3 class="text-center mb-4">Vervang Gebruiker voor Away</h3>
        <form method="POST" action="{{ url_for('verwerk_lid_toevoegen_lijst') }}" id="vervangGebruikerForm">
            <input type="hidden" name="away_id" value="{{ away_id }}" />
            <div class="mb-3">
                <label for="nieuwe_gebruiker" class="form-label">Selecteer een nieuwe gebruiker:</label>
                <select class="form-control select2" id="nieuwe_gebruiker" name="nieuwe_gebruiker" required>
                    <option value="">Selecteer een nieuwe gebruiker</option>
                    {% for lid in lijst_mogelijke_leden %}
                    <option value="{{ lid[0] }}">{{ lid[1] }} {{ lid[2] }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('bewerk_lijst', away_id=away_id) }}" class="btn btn-secondary">Terug</a>
                <button type="submit" class="btn btn-primary">Opslaan</button>
            </div>
        </form>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
<script>
    $(document).ready(function () {
        $('#nieuwe_gebruiker').select2({
            placeholder: "Zoek en selecteer een gebruiker",
            allowClear: true,
            width: '100%'
        });

        // Alleen letters A-Z/a-z toelaten in het zoekveld van Select2
        $('#nieuwe_gebruiker').on('select2:open', function () {
            setTimeout(function () {
                let searchBox = document.querySelector('.select2-container--open .select2-search__field');
                if (searchBox) {
                    searchBox.addEventListener('input', function () {
                        this.value = this.value.replace(/[^a-zA-ZÀ-ÿ\s]/g, '');
                    });
                }
            }, 0);
        });
    });
</script>
</body>
</html>
