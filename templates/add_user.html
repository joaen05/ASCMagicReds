<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gebruiker Toevoegen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        body {
            background-color: #f8f9fa;
        }

        .container {
            max-width: 700px;
            margin-top: 40px;
        }

        .card {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            background: white;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .form-actions .btn {
            min-width: 120px;
        }

        .search-container {
            position: relative;
            margin-bottom: 15px;
        }

        .search-container input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .search-results {
            position: absolute;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: white;
            z-index: 1000;
            display: none;
        }

        .search-results div {
            padding: 8px;
            cursor: pointer;
        }

        .search-results div:hover {
            background-color: #f0f0f0;
        }

        .selected-display {
            background-color: #f0f0f0;
            padding: 8px;
            border-radius: 4px;
            margin-top: 5px;
            border: 1px solid #ddd;
            display: none;
        }

        .form-label {
            font-weight: 500;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h3 class="text-center mb-4">Voeg een nieuw lid toe</h3>
            <form method="POST" id="userForm">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="voornaam" class="form-label">Voornaam:</label>
                        <input type="text" class="form-control" id="voornaam" name="voornaam"
                           pattern="[A-Za-zÀ-ÿ\s]+" title="Enkel letters zijn toegestaan" required
                           onkeypress="return /[A-Za-zÀ-ÿ\s]/.test(event.key)">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="naam" class="form-label">Achternaam:</label>
                        <input type="text" class="form-control" id="naam" name="naam"
                           pattern="[A-Za-zÀ-ÿ\s]+" title="Enkel letters zijn toegestaan" required
                           onkeypress="return /[A-Za-zÀ-ÿ\s]/.test(event.key)">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label for="email" class="form-label">E-mailadres:</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="one_account_id" class="form-label">One Account ID:</label>
                        <input type="number" class="form-control" id="one_account_id" name="one_account_id" min="0" required
                               onkeypress="return event.charCode >= 48 && event.charCode <= 57">
                    </div>
                </div>

                <!-- Postcode en Gemeente -->
                <div class="row">
                    <div class="col-md-6 mb-3 search-container">
                        <label for="postcodeSearch" class="form-label">Postcode:</label>
                        <input type="text" id="postcodeSearch" class="form-control" placeholder="Zoek postcode..."
                               pattern="\d*" title="Enkel cijfers zijn toegestaan"
                               onkeypress="return event.charCode >= 48 && event.charCode <= 57"
                                oninput="searchPostcodes(this.value)"
                               onfocus="showResults('postcodeResults')"
                               onblur="setTimeout(() => hideResults('postcodeResults'), 200)">
                        <div id="postcodeResults" class="search-results"></div>
                        <input type="hidden" id="selectedPostcode" name="adres_postcode">
                        <div id="selectedPostcodeDisplay" class="selected-display"></div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="gemeenteDropdown" class="form-label">Gemeente:</label>
                        <select class="form-select" id="gemeenteDropdown" name="adres_gemeente" disabled required
                                onchange="gemeenteSelected(this.value)">
                            <option value="" selected disabled>Selecteer een gemeente</option>
                        </select>
                        <div id="selectedGemeenteDisplay" class="selected-display"></div>
                    </div>
                </div>

                <!-- Straat en Huisnummer -->
                <div class="row">
                    <div class="col-md-8 mb-3 search-container">
                        <label for="straatSearch" class="form-label">Straat:</label>
                        <input type="text" id="straatSearch" class="form-control" placeholder="Zoek straat..."
                               pattern="[A-Za-zÀ-ÿ\s]+" title="Enkel letters zijn toegestaan"
                               onkeypress="return /[A-Za-zÀ-ÿ\s]/.test(event.key)"
                               oninput="searchStraten(this.value)"
                               onfocus="showResults('straatResults')"
                               onblur="setTimeout(() => hideResults('straatResults'), 200)"
                               disabled>
                        <div id="straatResults" class="search-results"></div>
                        <input type="hidden" id="selectedStraat" name="adres_straat">
                        <div id="selectedStraatDisplay" class="selected-display"></div>
                    </div>
                    <div class="col-md-4 mb-3 search-container">
                        <label for="huisnummerSearch" class="form-label">Huisnummer:</label>
                        <input type="text" id="huisnummerSearch" class="form-control" placeholder="Zoek huisnummer..."
                               pattern="[A-Za-z0-9]+" title="Enkel letters en cijfers zijn toegestaan"
                               onkeypress="return /[A-Za-z0-9]/.test(event.key)"
                               oninput="searchHuisnummers(this.value)"
                               onfocus="showResults('huisnummerResults')"
                               onblur="setTimeout(() => hideResults('huisnummerResults'), 200)"
                               disabled>
                        <div id="huisnummerResults" class="search-results"></div>
                        <input type="hidden" id="selectedHuisnummer" name="adres_nr">
                        <div id="selectedHuisnummerDisplay" class="selected-display"></div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="rijksregisternummer" class="form-label">Rijksregisternummer:</label>
                        <input type="text" class="form-control" id="rijksregisternummer" name="rijksregisternummer"
                               pattern="[\d-]+" title="Enkel cijfers en streepjes zijn toegestaan" required
                               onkeypress="return (event.charCode >= 48 && event.charCode <= 57) || event.charCode === 45">
                    </div>
                    <div class="col-md-3 mb-3">
                        <label for="abo_ja_nee" class="form-label">Abonnement:</label>
                        <select class="form-select" id="abo_ja_nee" name="abo_ja_nee" required>
                            <option value="ja">Ja</option>
                            <option value="nee">Nee</option>
                        </select>
                    </div>
                    <div class="col-md-5 mb-3">
                        <label for="telefoonnummer" class="form-label">Telefoonnummer:</label>
                        <input type="text" class="form-control" id="telefoonnummer" name="telefoonnummer"
                               pattern="[\d+]+" title="Enkel cijfers en + teken zijn toegestaan" required
                               onkeypress="return (event.charCode >= 48 && event.charCode <= 57) || event.charCode === 43">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="puntenaantal" class="form-label">Puntenaantal:</label>
                        <input type="number" class="form-control" id="puntenaantal" name="puntenaantal" min="0" required>
                    </div>
                </div>

                <div class="form-actions">
                    <a href="{{ url_for('beheer_leden') }}" class="btn btn-secondary">Ga terug</a>
                    <button type="submit" class="btn btn-primary">Toevoegen</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Globale variabelen
        let currentPostcode = '';
        let currentHoofdgemeente = '';
        let allPostcodes = [];
        let allGemeenten = [];
        let allStraten = [];
        let allHuisnummers = [];

        // Initialiseer bij het laden van de pagina
        document.addEventListener('DOMContentLoaded', function() {
            fetchPostcodes();
        });

        // Toon/verberg resultaten
        function showResults(elementId) {
            const element = document.getElementById(elementId);
            if (element && element.innerHTML.trim() !== '') {
                element.style.display = 'block';
            }
        }

        function hideResults(elementId) {
            const element = document.getElementById(elementId);
            if (element) {
                element.style.display = 'none';
            }
        }

        // Reset functies
        function resetStraatFields() {
            document.getElementById("straatSearch").value = "";
            document.getElementById("selectedStraat").value = "";
            document.getElementById("selectedStraatDisplay").textContent = "";
            document.getElementById("selectedStraatDisplay").style.display = "none";
            document.getElementById("huisnummerSearch").value = "";
            document.getElementById("selectedHuisnummer").value = "";
            document.getElementById("selectedHuisnummerDisplay").textContent = "";
            document.getElementById("selectedHuisnummerDisplay").style.display = "none";
            document.getElementById("huisnummerSearch").disabled = true;
            allStraten = [];
            allHuisnummers = [];
        }

        function resetHuisnummerField() {
            document.getElementById("huisnummerSearch").value = "";
            document.getElementById("selectedHuisnummer").value = "";
            document.getElementById("selectedHuisnummerDisplay").textContent = "";
            document.getElementById("selectedHuisnummerDisplay").style.display = "none";
            allHuisnummers = [];
        }

        // Selecteer een waarde uit de zoekresultaten
        function selectValue(inputId, displayId, value, displayValue, nextFieldId = null) {
            const inputElement = document.getElementById(inputId);
            const displayElement = document.getElementById(displayId);

            if (!inputElement || !displayElement) {
                console.error('Element niet gevonden:', !inputElement ? inputId : displayId);
                return;
            }

            inputElement.value = value;
            displayElement.textContent = displayValue;
            displayElement.style.display = 'block';

            // Reset downstream velden indien nodig
            if (inputId === "selectedPostcode") {
                document.getElementById("gemeenteDropdown").value = "";
                document.getElementById("selectedGemeenteDisplay").textContent = "";
                document.getElementById("selectedGemeenteDisplay").style.display = "none";
                resetStraatFields();
            } else if (inputId === "selectedStraat") {
                resetHuisnummerField();
            }

            // Verberg de resultaten
            const resultsContainerId = inputId.replace('selected', '').replace('Search', 'Results');
            hideResults(resultsContainerId);

            // Activeer het volgende veld indien opgegeven
            if (nextFieldId) {
                const nextField = document.getElementById(nextFieldId);
                if (nextField) {
                    nextField.disabled = false;
                    nextField.focus();
                }
            }
        }

        // Haal alle postcodes op
        async function fetchPostcodes() {
            const postcodeSearch = document.getElementById("postcodeSearch");
            postcodeSearch.placeholder = "Laden...";
            postcodeSearch.disabled = true;

            let nextUrl = "https://api.basisregisters.vlaanderen.be/v2/postinfo";

            try {
                while (nextUrl) {
                    const response = await fetch(nextUrl);
                    if (!response.ok) throw new Error(`HTTP-fout: ${response.status}`);
                    const data = await response.json();

                    if (data.postInfoObjecten?.length > 0) {
                        const postcodes = data.postInfoObjecten.map(p => p.identificator.objectId);
                        allPostcodes = [...new Set([...allPostcodes, ...postcodes])].sort((a, b) => a - b);
                    }

                    nextUrl = data.volgende;
                }

                postcodeSearch.placeholder = "Zoek postcode...";
                postcodeSearch.disabled = false;
            } catch (error) {
                console.error("Fout bij het ophalen van postcodes:", error);
                postcodeSearch.placeholder = "Fout bij laden";
            }
        }

        // Zoek postcodes
        function searchPostcodes(query) {
            const resultsContainer = document.getElementById("postcodeResults");
            if (!resultsContainer) return;

            resultsContainer.innerHTML = '';

            if (query.length < 1) {
                hideResults('postcodeResults');
                return;
            }

            const filtered = allPostcodes.filter(pc => pc.includes(query));
            if (filtered.length === 0) {
                resultsContainer.innerHTML = '<div>Geen resultaten gevonden</div>';
            } else {
                filtered.forEach(pc => {
                    const div = document.createElement('div');
                    div.textContent = pc;
                    div.onclick = () => {
                        selectValue('selectedPostcode', 'selectedPostcodeDisplay', pc, pc);
                        fetchGemeentenByPostcode(pc);
                    };
                    resultsContainer.appendChild(div);
                });
            }

            showResults('postcodeResults');
        }

        // Haal gemeenten op voor een postcode
        async function fetchGemeentenByPostcode(postcode) {
            currentPostcode = postcode;
            const gemeenteDropdown = document.getElementById("gemeenteDropdown");
            gemeenteDropdown.disabled = true;
            gemeenteDropdown.innerHTML = '<option value="" selected disabled>Laden...</option>';

            try {
                const response = await fetch(`https://api.basisregisters.vlaanderen.be/v2/postinfo/${postcode}`);
                if (!response.ok) throw new Error(`HTTP-fout: ${response.status}`);
                const data = await response.json();

                // Bewaar hoofdgemeente apart (voor straatopzoekingen)
                currentHoofdgemeente = data.gemeente?.gemeentenaam?.geografischeNaam?.spelling || '';

                // Gebruik alleen de postnamen voor dropdown
                const gemeenten = data.postnamen?.map(p => p.geografischeNaam.spelling) || [];

                // Vul dropdown
                gemeenteDropdown.innerHTML = '<option value="" selected disabled>Selecteer een gemeente</option>';

                gemeenten.sort().forEach(gemeente => {
                    const option = document.createElement('option');
                    option.value = gemeente;
                    option.textContent = gemeente;
                    gemeenteDropdown.appendChild(option);
                });

                gemeenteDropdown.disabled = false;
                document.getElementById("straatSearch").disabled = gemeenten.length === 0;

            } catch (error) {
                console.error("Fout bij het ophalen van gemeenten:", error);
                gemeenteDropdown.innerHTML = '<option value="" selected disabled>Fout bij laden</option>';
            }
        }

        // Gemeente selectie handler
        function gemeenteSelected(gemeente) {
            if (gemeente) {
                document.getElementById("selectedGemeenteDisplay").textContent = gemeente;
                document.getElementById("selectedGemeenteDisplay").style.display = "block";
                resetStraatFields();
                document.getElementById("straatSearch").disabled = false;
                fetchStratenByGemeente();
            }
        }

        // Haal straten op voor de hoofdgemeente
        async function fetchStratenByGemeente() {
            const straatSearch = document.getElementById("straatSearch");
            straatSearch.placeholder = "Laden...";
            straatSearch.disabled = true;
            allStraten = [];

            try {
                let nextUrl = `https://api.basisregisters.vlaanderen.be/v2/straatnamen?gemeentenaam=${encodeURIComponent(currentHoofdgemeente)}`;

                while (nextUrl) {
                    const response = await fetch(nextUrl);
                    if (!response.ok) throw new Error(`HTTP-fout: ${response.status}`);
                    const data = await response.json();

                    if (data.straatnamen?.length > 0) {
                        const straten = data.straatnamen.map(s => s.straatnaam.geografischeNaam.spelling);
                        allStraten = [...new Set([...allStraten, ...straten])].sort();
                    }

                    nextUrl = data.volgende;
                }

                straatSearch.placeholder = "Zoek straat...";
                straatSearch.disabled = false;
                straatSearch.focus();
            } catch (error) {
                console.error("Fout bij het ophalen van straten:", error);
                straatSearch.placeholder = "Fout bij laden";
            }
        }

        // Zoek straten
        function searchStraten(query) {
            const resultsContainer = document.getElementById("straatResults");
            if (!resultsContainer) return;

            resultsContainer.innerHTML = '';

            if (query.length < 1) {
                hideResults('straatResults');
                return;
            }

            const filtered = allStraten.filter(s => s.toLowerCase().includes(query.toLowerCase()));
            if (filtered.length === 0) {
                resultsContainer.innerHTML = '<div>Geen resultaten gevonden</div>';
            } else {
                filtered.forEach(s => {
                    const div = document.createElement('div');
                    div.textContent = s;
                    div.onclick = () => {
                        selectValue('selectedStraat', 'selectedStraatDisplay', s, s, 'huisnummerSearch');
                        fetchHuisnummersByStraat(s);
                    };
                    resultsContainer.appendChild(div);
                });
            }

            showResults('straatResults');
        }

        // Haal huisnummers op voor een straat
        async function fetchHuisnummersByStraat(straat) {
            const huisnummerSearch = document.getElementById("huisnummerSearch");
            huisnummerSearch.placeholder = "Laden...";
            huisnummerSearch.disabled = true;
            allHuisnummers = [];

            try {
                const response = await fetch(`https://api.basisregisters.vlaanderen.be/v2/adressen?straatnaam=${encodeURIComponent(straat)}&postcode=${currentPostcode}`);
                if (!response.ok) throw new Error(`HTTP-fout: ${response.status}`);
                const data = await response.json();

                if (data.adressen?.length > 0) {
                    allHuisnummers = data.adressen.map(a => a.huisnummer).filter((v, i, a) => a.indexOf(v) === i).sort();
                }

                huisnummerSearch.placeholder = "Zoek huisnummer...";
                huisnummerSearch.disabled = false;
                huisnummerSearch.focus();
            } catch (error) {
                console.error("Fout bij het ophalen van huisnummers:", error);
                huisnummerSearch.placeholder = "Fout bij laden";
            }
        }

        // Zoek huisnummers
        function searchHuisnummers(query) {
            const resultsContainer = document.getElementById("huisnummerResults");
            if (!resultsContainer) return;

            resultsContainer.innerHTML = '';

            if (query.length < 1) {
                hideResults('huisnummerResults');
                return;
            }

            const filtered = allHuisnummers.filter(hn => hn.toString().includes(query));
            if (filtered.length === 0) {
                resultsContainer.innerHTML = '<div>Geen resultaten gevonden</div>';
            } else {
                filtered.forEach(hn => {
                    const div = document.createElement('div');
                    div.textContent = hn;
                    div.onclick = () => {
                        selectValue('selectedHuisnummer', 'selectedHuisnummerDisplay', hn, hn);
                    };
                    resultsContainer.appendChild(div);
                });
            }

            showResults('huisnummerResults');
        }
    </script>
</body>
</html>
