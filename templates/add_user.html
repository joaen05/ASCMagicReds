<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gebruiker Toevoegen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }
        body {
            background-color: #f8f9fa;
        }

        .container {
            max-width: 700px;
            margin-top: 40px;
        }

        .card {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            background: white;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .form-actions .btn {
            min-width: 120px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h3 class="text-center mb-4">Voeg een nieuw lid toe</h3>
            <form method="POST" id="userForm" onsubmit="return validateForm()">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="voornaam" class="form-label">Voornaam:</label>
                        <input type="text" class="form-control" id="voornaam" name="voornaam" value="{{ voornaam }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="naam" class="form-label">Achternaam:</label>
                        <input type="text" class="form-control" id="naam" name="naam" value="{{ naam }}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label for="email" class="form-label">E-mailadres:</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ email }}" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="one_account_id" class="form-label">One Account ID:</label>
                        <input type="number" class="form-control" id="one_account_id" name="one_account_id" value="{{ one_account_id }}" min= "0" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="adres_postcode" class="form-label">Postcode:</label>
                        <input type="number" class="form-control" id="adres_postcode" name="adres_postcode" value="{{ adres_postcode }}" min= "0" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="adres_gemeente" class="form-label">Gemeente:</label>
                        <input type="text" class="form-control" id="adres_gemeente" name="adres_gemeente" value="{{ adres_gemeente }}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label for="adres_straat" class="form-label">Straat:</label>
                        <input type="text" class="form-control" id="adres_straat" name="adres_straat" value="{{ adres_straat }}" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="adres_nr" class="form-label">Huisnummer:</label>
                        <input type="text" class="form-control" id="adres_nr" name="adres_nr" value="{{ adres_nr }}" min= "0" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="rijksregisternummer" class="form-label">Rijksregisternummer:</label>
                        <input type="text" class="form-control" id="rijksregisternummer" name="rijksregisternummer" value="{{ rijksregisternummer }}" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label for="abo_ja_nee" class="form-label">Abonnement:</label>
                        <select class="form-select" id="abo_ja_nee" name="abo_ja_nee" required>
                            <option value="ja" {% if abo_ja_nee == 'ja' %}selected{% endif %}>Ja</option>
                            <option value="nee" {% if abo_ja_nee == 'nee' %}selected{% endif %}>Nee</option>
                        </select>
                    </div>
                    <div class="col-md-5 mb-3">
                        <label for="telefoonnummer" class="form-label">Telefoonnummer:</label>
                        <input type="text" class="form-control" id="telefoonnummer" name="telefoonnummer" value="{{ telefoonnummer }}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="puntenaantal" class="form-label">Puntenaantal:</label>
                        <input type="number" class="form-control" id="puntenaantal" name="puntenaantal" value="{{ puntenaantal }}" min="0" required>
                    </div>
                </div>

                <div class="form-actions">
                    <a href="{{ url_for('beheer_leden') }}" class="btn btn-secondary">Ga terug</a>
                    <button type="submit" class="btn btn-primary">Toevoegen</button>
                </div>
            </form>

            {% if error %}
            <div class="alert alert-danger mt-4" role="alert">
                {{ error }}
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
