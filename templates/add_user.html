<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gebruiker Toevoegen</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
     <style>
        /* Verberg de spinner (pijltjes) in het number input veld */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
          -webkit-appearance: none;
          margin: 0;
        }

        input[type="number"] {
          -moz-appearance: textfield;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Voeg een nieuw lid toe</h2>
        <a href="{{ url_for('beheer_leden') }}" class="btn btn-secondary position-absolute" style="top: 10px; right: 80px;">Ga terug</a>

        <br>
        <form method="POST" id="userForm" onsubmit="return validateForm()">
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="voornaam">Voornaam:</label>
                    <input type="text" class="form-control" id="voornaam" name="voornaam" value="{{ voornaam }}" required>
                </div>
                <div class="form-group col-md-6">
                    <label for="naam">Achternaam:</label>
                    <input type="text" class="form-control" id="naam" name="naam" value="{{ naam }}" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group col-md-9">
                    <label for="email">E-mailadres:</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ email }}" required>
                </div>
                <div class="form-group col-md-3">
                    <label for="one_account_id">One Account ID:</label>
                    <input type="number" class="form-control" id="one_account_id" name="one_account_id" value="{{ one_account_id }}" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="adres_postcode">Postcode:</label>
                    <input type="number" class="form-control" id="adres_postcode" name="adres_postcode" value="{{ adres_postcode }}" required>
                </div>
                <div class="form-group col-md-6">
                    <label for="adres_gemeente">Gemeente:</label>
                    <input type="text" class="form-control" id="adres_gemeente" name="adres_gemeente" value="{{ adres_gemeente }}" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group col-md-8">
                    <label for="adres_straat">Straat:</label>
                    <input type="text" class="form-control" id="adres_straat" name="adres_straat" value="{{ adres_straat }}" required>
                </div>
                <div class="form-group col-md-4">
                    <label for="adres_nr">Huisnummer:</label>
                    <input type="text" class="form-control" id="adres_nr" name="adres_nr" value="{{ adres_nr }}" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group col-md-3">
                    <label for="rijksregisternummer">Rijksregisternummer:</label>
                    <input type="text" class="form-control" id="rijksregisternummer" name="rijksregisternummer" value="{{ rijksregisternummer }}" required>
                </div>
                <div class="form-group col-md-2">
                    <label for="abo_ja_nee">Abonnement:</label>
                    <select class="form-control" id="abo_ja_nee" name="abo_ja_nee" required>
                        <option value="ja" {% if abo_ja_nee == 'ja' %}selected{% endif %}>Ja</option>
                        <option value="nee" {% if abo_ja_nee == 'nee' %}selected{% endif %}>Nee</option>
                    </select>
                </div>
                <div class="form-group col-md-4">
                    <label for="telefoonnummer">Telefoonnummer:</label>
                    <input type="text" class="form-control" id="telefoonnummer" name="telefoonnummer" value="{{ telefoonnummer }}" required>
                </div>
                <div class="form-group col-md-3">
                    <label for="puntenaantal">Puntenaantal:</label>
                    <input type="number" class="form-control" id="puntenaantal" name="puntenaantal" value="{{ puntenaantal }}" required>
                </div>
            <button type="submit" class="btn btn-primary">Toevoegen</button>
            </div>
        </form>

        {% if error %}
        <div class="alert alert-danger mt-4" role="alert">
            {{ error }}
        </div>
        {% endif %}
    </div>
</body>
</html>
