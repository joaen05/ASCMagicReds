<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lid Bewerken</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }

        body {
            background-color: #f8f9fa;
        }

        .container {
            max-width: 700px;
            margin-top: 40px;
        }

        .card {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            background: white;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .form-actions .btn {
            min-width: 120px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h3 class="text-center mb-4">Lid Bewerken</h3>
            <form method="POST" action="{{ url_for('edit_member', id=member['id']) }}" id="editMemberForm" onsubmit="return validateForm()">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="voornaam" class="form-label">Voornaam:</label>
                        <input type="text" class="form-control" id="voornaam" name="voornaam" value="{{ member['voornaam'] }}" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="naam" class="form-label">Achternaam:</label>
                        <input type="text" class="form-control" id="naam" name="naam" value="{{ member['naam'] }}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label for="email" class="form-label">E-mailadres:</label>
                        <input type="email" class="form-control" id="email" name="email" value="{{ member['email'] }}" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="one_account_id" class="form-label">One Account ID:</label>
                        <input type="number" class="form-control" id="one_account_id" name="one_account_id" value="{{ member['one_account_id'] }}" min="0" required>
                    </div>
                </div>

                <!-- Postcode en Gemeente -->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="postcodeDropdown" class="form-label">Postcode:</label>
                        <input type="text" id="postcodeSearch" class="form-control" placeholder="Zoek postcode..." oninput="filterDropdown('postcodeDropdown', this.value)">
                        <select id="postcodeDropdown" class="form-control" name="adres_postcode" onchange="fetchGemeentenByPostcode(this.value)" required>
                            <option value="{{ member['adres_postcode'] }}">{{ member['adres_postcode'] }}</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="gemeenteDropdown" class="form-label">Gemeente:</label>
                        <select id="gemeenteDropdown" class="form-control" name="adres_gemeente" required>
                            <option value="{{ member['adres_gemeente'] }}">{{ member['adres_gemeente'] }}</option>
                        </select>
                    </div>
                </div>

                <!-- Straat en Huisnummer -->
                <div class="row">
                    <div class="col-md-8 mb-3">
                        <label for="straatDropdown" class="form-label">Straat:</label>
                        <input type="text" id="straatSearch" class="form-control" placeholder="Zoek straat..." oninput="filterDropdown('straatDropdown', this.value)">
                        <select id="straatDropdown" class="form-control" name="adres_straat" required>
                            <option value="{{ member['adres_straat'] }}">{{ member['adres_straat'] }}</option>
                        </select>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label for="huisnummerDropdown" class="form-label">Huisnummer:</label>
                        <input type="text" id="huisnummerSearch" class="form-control" placeholder="Zoek huisnummer..." oninput="filterDropdown('huisnummerDropdown', this.value)">
                        <select id="huisnummerDropdown" class="form-control" name="adres_nr" required>
                            <option value="{{ member['adres_nr'] }}">{{ member['adres_nr'] }}</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="rijksregisternummer" class="form-label">Rijksregisternummer:</label>
                        <input type="text" class="form-control" id="rijksregisternummer" name="rijksregisternummer" value="{{ member['rijksregisternummer'] }}" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label for="abo_ja_nee" class="form-label">Abonnement:</label>
                        <select class="form-select" id="abo_ja_nee" name="abo_ja_nee" required>
                            <option value="ja" {% if member['abo_ja_nee'] == 'ja' %}selected{% endif %}>Ja</option>
                            <option value="nee" {% if member['abo_ja_nee'] == 'nee' %}selected{% endif %}>Nee</option>
                        </select>
                    </div>
                    <div class="col-md-5 mb-3">
                        <label for="telefoonnummer" class="form-label">Telefoonnummer:</label>
                        <input type="text" class="form-control" id="telefoonnummer" name="telefoonnummer" value="{{ member['telefoonnummer'] }}" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label for="puntenaantal" class="form-label">Puntenaantal:</label>
                        <input type="number" class="form-control" id="puntenaantal" name="puntenaantal" value="{{ member['puntenaantal'] }}" min="0" required>
                    </div>
                </div>

                <div class="form-actions">
                    <a href="{{ url_for('beheer_leden') }}" class="btn btn-secondary">Ga terug</a>
                    <button type="submit" class="btn btn-primary">Opslaan</button>
                </div>
            </form>

            {% if error %}
            <div class="alert alert-danger mt-4" role="alert">
                {{ error }}
            </div>
            {% endif %}
        </div>
    </div>



    <script>
    // Functie om een dropdown bij te werken met opties
    function updateDropdown(dropdownId, items, defaultText) {
        const dropdown = document.getElementById(dropdownId);
        dropdown.innerHTML = `<option value="">${defaultText}</option>`;

        if (items && items.length > 0) {
            dropdown.innerHTML += items.map(item => `<option value="${item}">${item}</option>`).join("");
        }
    }

    // Functie om een dropdown te filteren op basis van zoektekst
    function filterDropdown(dropdownId, searchText) {
        const dropdown = document.getElementById(dropdownId);
        const options = dropdown.options;

        for (let i = 0; i < options.length; i++) {
            const option = options[i];
            if (option.text.toLowerCase().includes(searchText.toLowerCase())) {
                option.style.display = "";
            } else {
                option.style.display = "none";
            }
        }
    }

    // Haal alle postcodes op bij het laden van de pagina
    async function fetchPostcodes() {
        const postcodeDropdown = document.getElementById("postcodeDropdown");
        postcodeDropdown.innerHTML = "<option value=''>Laden...</option>";
        postcodeDropdown.disabled = true;

        let allPostcodes = [];
        let nextUrl = "https://api.basisregisters.vlaanderen.be/v2/postinfo";

        try {
            while (nextUrl) {
                const response = await fetch(nextUrl);
                if (!response.ok) {
                    throw new Error(`HTTP-fout: ${response.status}`);
                }
                const data = await response.json();
                console.log("Vlaamse Overheid API-respons (postcodes):", data);

                if (data.postInfoObjecten && data.postInfoObjecten.length > 0) {
                    const geldigePostcodes = data.postInfoObjecten.filter(postinfo => {
                        return postinfo.postnamen.some(postnaam => postnaam.geografischeNaam.spelling === postnaam.geografischeNaam.spelling.toUpperCase());
                    }).map(postinfo => postinfo.identificator.objectId);

                    allPostcodes = allPostcodes.concat(geldigePostcodes);
                } else {
                    throw new Error("Geen postcodes gevonden");
                }

                nextUrl = data.volgende;
            }

            const uniquePostcodes = [...new Set(allPostcodes)];
            updateDropdown("postcodeDropdown", uniquePostcodes, "Selecteer een postcode");

            // Selecteer de postcode die al in de database staat
            const currentPostcode = "{{ member['adres_postcode'] }}";
            if (currentPostcode) {
                postcodeDropdown.value = currentPostcode;
                fetchGemeentenByPostcode(currentPostcode); // Haal de gemeenten op voor de geselecteerde postcode
            }
        } catch (error) {
            console.error("Fout bij het ophalen van postcodes:", error);
            updateDropdown("postcodeDropdown", [], "Fout bij laden");
        } finally {
            postcodeDropdown.disabled = false;
        }
    }

    // Haal gemeenten op voor een geselecteerde postcode
    async function fetchGemeentenByPostcode(postcode) {
        console.log("Geselecteerde postcode:", postcode); // Debugging
        const gemeenteDropdown = document.getElementById("gemeenteDropdown");
        gemeenteDropdown.innerHTML = "<option value=''>Laden...</option>";
        gemeenteDropdown.disabled = true;

        try {
            const response = await fetch(`https://api.basisregisters.vlaanderen.be/v2/postinfo/${postcode}`);
            if (!response.ok) {
                throw new Error(`HTTP-fout: ${response.status}`);
            }
            const data = await response.json();
            console.log("API-respons voor gemeenten:", data); // Debugging

            if (data.postnamen && data.postnamen.length > 0) {
                const gemeenten = data.postnamen
                    .filter(postnaam => postnaam.geografischeNaam.spelling === postnaam.geografischeNaam.spelling.toUpperCase())
                    .map(postnaam => postnaam.geografischeNaam.spelling);

                if (gemeenten.length > 0) {
                    updateDropdown("gemeenteDropdown", gemeenten, "Selecteer een gemeente");
                    gemeenteDropdown.disabled = false; // Zorg ervoor dat de dropdown wordt ingeschakeld

                    // Selecteer de gemeente die al in de database staat
                    const currentGemeente = "{{ member['adres_gemeente'] }}";
                    if (currentGemeente) {
                        gemeenteDropdown.value = currentGemeente;
                        fetchStratenByGemeente(currentGemeente); // Haal de straten op voor de geselecteerde gemeente
                    }
                } else {
                    throw new Error("Geen geldige gemeenten gevonden");
                }
            } else {
                throw new Error("Geen gemeenten gevonden");
            }
        } catch (error) {
            console.error("Fout bij het ophalen van gemeenten:", error);
            updateDropdown("gemeenteDropdown", [], "Geen geldige gemeenten");
        }
    }

    // Haal straten op voor een geselecteerde gemeente
    async function fetchStratenByGemeente(gemeente) {
        console.log("Geselecteerde gemeente:", gemeente); // Debugging
        const straatDropdown = document.getElementById("straatDropdown");
        straatDropdown.innerHTML = "<option value=''>Laden...</option>";
        straatDropdown.disabled = true;

        let allStraten = [];
        let nextUrl = `https://api.basisregisters.vlaanderen.be/v2/straatnamen?gemeentenaam=${encodeURIComponent(gemeente)}`;

        try {
            while (nextUrl) {
                const response = await fetch(nextUrl);
                if (!response.ok) {
                    throw new Error(`HTTP-fout: ${response.status}`);
                }
                const data = await response.json();
                console.log("API-respons voor straten:", data); // Debugging

                if (data.straatnamen && data.straatnamen.length > 0) {
                    const straten = data.straatnamen.map(item => item.straatnaam.geografischeNaam.spelling);
                    allStraten = allStraten.concat(straten);
                }

                nextUrl = data.volgende;
            }

            const uniqueStraten = [...new Set(allStraten)];
            updateDropdown("straatDropdown", uniqueStraten, "Selecteer een straat");
            straatDropdown.disabled = false; // Zorg ervoor dat de dropdown wordt ingeschakeld

            // Selecteer de straat die al in de database staat
            const currentStraat = "{{ member['adres_straat'] }}";
            if (currentStraat) {
                straatDropdown.value = currentStraat;
                fetchHuisnummersByStraat(currentStraat); // Haal de huisnummers op voor de geselecteerde straat
            }
        } catch (error) {
            console.error("Fout bij het ophalen van straten:", error);
            updateDropdown("straatDropdown", [], "Fout bij laden");
        }
    }

    // Haal huisnummers op voor een geselecteerde straat
    async function fetchHuisnummersByStraat(straat) {
        console.log("Geselecteerde straat:", straat); // Debugging
        const huisnummerDropdown = document.getElementById("huisnummerDropdown");
        huisnummerDropdown.innerHTML = "<option value=''>Laden...</option>";
        huisnummerDropdown.disabled = true;

        let allHuisnummers = [];
        let nextUrl = `https://api.basisregisters.vlaanderen.be/v2/adressen?straatnaam=${encodeURIComponent(straat)}`;

        try {
            while (nextUrl) {
                const response = await fetch(nextUrl);
                if (!response.ok) {
                    throw new Error(`HTTP-fout: ${response.status}`);
                }
                const data = await response.json();
                console.log("API-respons voor huisnummers:", data); // Debugging

                if (data.adressen && data.adressen.length > 0) {
                    const huisnummers = data.adressen.map(item => item.huisnummer);
                    allHuisnummers = allHuisnummers.concat(huisnummers);
                }

                nextUrl = data.volgende;
            }

            const sortedHuisnummers = allHuisnummers.sort((a, b) => a - b);
            const uniqueHuisnummers = [...new Set(sortedHuisnummers)];
            updateDropdown("huisnummerDropdown", uniqueHuisnummers, "Selecteer een huisnummer");
            huisnummerDropdown.disabled = false; // Zorg ervoor dat de dropdown wordt ingeschakeld

            // Selecteer het huisnummer dat al in de database staat
            const currentHuisnummer = "{{ member['adres_nr'] }}";
            if (currentHuisnummer) {
                huisnummerDropdown.value = currentHuisnummer;
            }
        } catch (error) {
            console.error("Fout bij het ophalen van huisnummers:", error);
            updateDropdown("huisnummerDropdown", [], "Fout bij laden");
        }
    }

    // Event listener voor postcode-dropdown
    document.getElementById("postcodeDropdown").addEventListener("change", function () {
        const geselecteerdePostcode = this.value;
        if (geselecteerdePostcode) {
            fetchGemeentenByPostcode(geselecteerdePostcode);
        }
    });

    // Event listener voor gemeente-dropdown
    document.getElementById("gemeenteDropdown").addEventListener("change", function () {
        const geselecteerdeGemeente = this.value;
        if (geselecteerdeGemeente) {
            fetchStratenByGemeente(geselecteerdeGemeente);
        }
    });

    // Event listener voor straat-dropdown
    document.getElementById("straatDropdown").addEventListener("change", function () {
        const geselecteerdeStraat = this.value;
        if (geselecteerdeStraat) {
            fetchHuisnummersByStraat(geselecteerdeStraat);
        }
    });

    // Initialiseer de postcode dropdown bij het laden van de pagina
    fetchPostcodes();
</script>
</body>
</html>
