<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bewerken Away Inschrijving</title>
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.0/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" rel="stylesheet" />
    <style>
        /* Verberg de spinner (pijltjes) in het number input veld */
        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Bewerken Away Inschrijving</h2>
        <a href="{{ url_for('inschrijven_away') }}" class="btn btn-secondary position-absolute" style="top: 10px; right: 80px;">Ga terug</a>
        <br>
        <form method="POST" id="inschrijvingForm">
            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="away_id">Naam van de Away:</label>
                    <select class="form-control" id="away_id" name="away_id" required>
                        {% for away in available_aways %}
                            <option value="{{ away[0] }}" {% if away[0]|int == away_details['away_id']|int %}selected{% endif %}>
                                {{ away[1] }}
                            </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group col-md-6">
                    <label for="aantal_kaarten">Aantal kaarten:</label>
                    <input type="number" class="form-control" id="aantal_kaarten" name="aantal_kaarten" value="{{ away_details['aantal_kaarten'] }}" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group col-md-12">
                    <label for="beschrijving">Beschrijving:</label>
                    <textarea class="form-control" id="beschrijving" name="beschrijving" rows="7" required>{{ away_details['beschrijving'] }}</textarea>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group col-md-6">
                    <label for="away_datum">Datum van de match:</label>
                    <input type="datetime-local" class="form-control" id="away_datum" name="away_datum" value="{{ away_details['away_datum'] }}" required>
                </div>
                <div class="form-group col-md-6">
                    <label for="inschrijving_einde">Inschrijving sluit op:</label>
                    <input type="datetime-local" class="form-control" id="inschrijving_einde" name="inschrijving_einde" value="{{ away_details['inschrijving_einde'] }}" required>
                </div>
            </div>

            <div class="form-row">
                <button type="submit" class="btn btn-primary">Inschrijving Bijwerken</button>
            </div>
        </form>
    </div>

    <!-- Voeg jQuery en Select2 toe -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#away_id').select2();  // Activeer de zoekbare dropdown
        });

        // Datumwaarden correct instellen in datetime-local veld
        function formatDateToInput(datetimeStr) {
            if (!datetimeStr) return "";
            return datetimeStr.replace(" ", "T");  // Zet spatie om naar 'T' voor datetime-local input
        }

        document.getElementById('away_datum').value = formatDateToInput("{{ away_details['away_datum'] }}");
        document.getElementById('inschrijving_einde').value = formatDateToInput("{{ away_details['inschrijving_einde'] }}");
    </script>
</body>
</html>
