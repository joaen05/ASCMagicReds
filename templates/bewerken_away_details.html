<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bewerken Away Inschrijving</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" rel="stylesheet"/>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            max-width: 700px;
            margin-top: 40px;
        }

        .card {
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 20px;
            background: white;
        }

        .form-label {
            font-weight: 500;
        }

        .form-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .select2-container .select2-selection--single {
            height: 38px;
            padding: 6px 12px;
            border: 1px solid #ced4da;
            border-radius: 4px;
        }

        input[type="number"]::-webkit-outer-spin-button,
        input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        input[type="number"] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h3 class="text-center mb-4">Bewerken Away Inschrijving</h3>
        <form method="POST" id="inschrijvingForm">
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="away_id" class="form-label">Naam van de Away:</label>
                    <select class="form-control" id="away_id" name="away_id" required>
                        {% for away in available_aways %}
                        <option value="{{ away[0] }}" {% if away[0]|int== away_details['away_id']|int %}selected{% endif %}>
                            {{ away[1] }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label for="aantal_kaarten" class="form-label">Aantal kaarten:</label>
                    <input type="number" class="form-control" id="aantal_kaarten" name="aantal_kaarten"
                           value="{{ away_details['aantal_kaarten'] }}" required>
                </div>
            </div>

            <div class="mb-3">
                <label for="beschrijving" class="form-label">Beschrijving:</label>
                <textarea class="form-control" id="beschrijving" name="beschrijving" rows="5" required>{{ away_details['beschrijving'] }}</textarea>
            </div>

            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="away_datum" class="form-label">Datum van de match:</label>
                    <input type="datetime-local" class="form-control" id="away_datum" name="away_datum"
                           value="{{ away_details['away_datum'] }}" required>
                </div>
                <div class="col-md-6">
                    <label for="inschrijving_einde" class="form-label">Inschrijving sluit op:</label>
                    <input type="datetime-local" class="form-control" id="inschrijving_einde" name="inschrijving_einde"
                           value="{{ away_details['inschrijving_einde'] }}" required>
                </div>
            </div>

            <div class="form-actions">
                <a href="{{ url_for('inschrijven_away', page=current_page) }}" class="btn btn-secondary">Ga terug</a>
                <button type="submit" class="btn btn-primary">Inschrijving Bijwerken</button>
            </div>
        </form>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
<script>
    $(document).ready(function () {
        $('#away_id').select2();

        $('#away_id').on('select2:open', function () {
            setTimeout(() => {
                let searchField = document.querySelector('.select2-container--open .select2-search__field');
                if (searchField) {
                    searchField.addEventListener('input', function () {
                        this.value = this.value.replace(/[^a-zA-ZÀ-ÿ\s]/g, '');
                    });
                }
            }, 0);
        });
    });

    function formatDateToInput(datetimeStr) {
        if (!datetimeStr) return "";
        return datetimeStr.replace(" ", "T");
    }

    document.addEventListener("DOMContentLoaded", function () {
        let inschrijvingEinde = document.getElementById("inschrijving_einde");
        let awayDatum = document.getElementById("away_datum");

        function formatDateToLocal(datetime) {
            let year = datetime.getFullYear();
            let month = String(datetime.getMonth() + 1).padStart(2, "0");
            let day = String(datetime.getDate()).padStart(2, "0");
            let hours = String(datetime.getHours()).padStart(2, "0");
            let minutes = String(datetime.getMinutes()).padStart(2, "0");
            return `${year}-${month}-${day}T${hours}:${minutes}`;
        }

        function setMinValues() {
            let now = new Date();
            inschrijvingEinde.min = formatDateToLocal(now);
            awayDatum.min = formatDateToLocal(now);
        }

        function updateMatchMin() {
            if (inschrijvingEinde.value) {
                let sluitMoment = new Date(inschrijvingEinde.value);
                sluitMoment.setMinutes(sluitMoment.getMinutes() + 1);
                awayDatum.min = formatDateToLocal(sluitMoment);
            }
        }

        function updateInschrijvingMax() {
            if (awayDatum.value) {
                let matchMoment = new Date(awayDatum.value);
                matchMoment.setMinutes(matchMoment.getMinutes() - 1);
                inschrijvingEinde.max = formatDateToLocal(matchMoment);
            }
        }

        function blockInvalidTimes() {
            let inschrijvingTime = new Date(inschrijvingEinde.value);
            let matchTime = new Date(awayDatum.value);

            if (awayDatum.value) {
                inschrijvingEinde.max = formatDateToLocal(new Date(matchTime.getTime() - 60000));
            }

            if (inschrijvingEinde.value) {
                awayDatum.min = formatDateToLocal(new Date(inschrijvingTime.getTime() + 60000));
            }
        }

        setMinValues();
        inschrijvingEinde.addEventListener("change", () => {
            updateMatchMin();
            blockInvalidTimes();
        });

        awayDatum.addEventListener("change", () => {
            updateInschrijvingMax();
            blockInvalidTimes();
        });
    });

    document.getElementById('away_datum').value = formatDateToInput("{{ away_details['away_datum'] }}");
    document.getElementById('inschrijving_einde').value = formatDateToInput("{{ away_details['inschrijving_einde'] }}");
</script>
</body>
</html>
